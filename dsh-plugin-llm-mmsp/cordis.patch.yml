# dsh-plugin-llm-mmsp cordis.patch.yml
#
# One host row; the module exports `inject = ['llm']`, so the loader mounts it
# under the LLM runtime. The `providers` dict is declared volatile in the
# plugin's Config schema, so the values below are the *base* layer: the web
# Models page edits the user layer on top of them without a restart, exactly
# like dsh-llm-pi-ai.
#
# The shipped profile points at the Penguin Go MMSP relay. Store the relay key
# as the credential `MMSP_API_KEY` (the Models page writes it), or export
# MMSP_API_KEY in the app's launch environment; remove or override the whole
# dict from user settings to run other routes.

- insert:
    - id: llm-mmsp
      name: '@zhuyeqi/dsh-plugin-llm-mmsp'
      config:
        providers:
          penguin-go:
            displayName: Penguin Go (MMSP)
            baseURL: https://go.penguin.ooo/api/v1
            apiKeyEnv: MMSP_API_KEY
            models:
              - id: deepseek-flash
                name: DeepSeek Flash
                contextWindow: 131072
                maxTokens: 8192
              - id: deepseek-v4-pro
                name: DeepSeek V4 Pro
                contextWindow: 131072
                maxTokens: 16384
              - id: gemini-3.5-flash
                name: Gemini 3.5 Flash
                contextWindow: 1048576
                maxTokens: 65536
                input: [text, image]
